[build]
  command = "npm run build"
  publish = ".next"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

# 环境变量（敏感信息不写在这里，去 Netlify 后台设置）
# 需要手动添加的变量（见 README）：
# NEXT_PUBLIC_SUPABASE_URL
# NEXT_PUBLIC_SUPABASE_ANON_KEY
# AI_API_KEY
# SUPABASE_SERVICE_ROLE_KEY
# NEXT_PUBLIC_APP_NAME
# NEXT_PUBLIC_SITE_URL
[build.environment]
  NEXT_PUBLIC_APP_NAME = "故事花园"
